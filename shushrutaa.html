<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Happy Deepavali, Shushrutaa</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Yatra+One&family=Noto+Sans+Telugu:wght@500&family=Cormorant+Garamond:ital,wght@1,500&display=swap" rel="stylesheet">
<style>
  :root{--gold:#ffc94d;--saffron:#ff8a1f;--magenta:#e0245e;--night:#12061f}
  *{box-sizing:border-box;margin:0}
  html,body{height:100%;overflow:hidden;background:radial-gradient(ellipse at 50% 85%,#4a1250 0%,#1d0a33 45%,var(--night) 100%);font-family:'Cormorant Garamond',serif;color:#fff}
  canvas{position:fixed;inset:0;width:100%;height:100%;display:block}
  .poster{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;padding-top:7vh;text-align:center;pointer-events:none}
  .te{font-family:'Noto Sans Telugu',sans-serif;font-size:clamp(14px,2.4vw,22px);color:#ffd9a0;letter-spacing:.08em;opacity:0;animation:rise 1.2s .3s forwards}
  h1{font-family:'Yatra One',serif;font-weight:400;font-size:clamp(40px,10vw,128px);line-height:1;margin-top:1.2vh;
     background:linear-gradient(100deg,#ff9d2e 0%,#ffe08a 30%,#fff6d0 45%,#ffc94d 60%,#ff7a1a 100%);background-size:250% 100%;
     -webkit-background-clip:text;background-clip:text;color:transparent;
     filter:drop-shadow(0 0 18px rgba(255,150,40,.55)) drop-shadow(0 6px 0 rgba(120,30,10,.6));
     opacity:0;animation:rise 1.4s .6s forwards,shine 5s 2s linear infinite}
  .name{font-family:'Yatra One',serif;font-size:clamp(32px,7.5vw,92px);margin-top:1vh;color:#ffe9b8;
     text-shadow:0 0 12px #ff8a1f,0 0 36px #e0245e,0 0 70px #e0245e;opacity:0;animation:rise 1.4s 1.1s forwards,glow 3s 2.5s ease-in-out infinite}
  .name span{display:inline-block;animation:bob 3s ease-in-out infinite}
  .line{font-size:clamp(15px,2.4vw,26px);margin-top:2vh;color:#ffd9a0;max-width:34ch;padding:0 20px;opacity:0;animation:rise 1.4s 1.7s forwards}
  .hint{position:fixed;bottom:2.5vh;width:100%;text-align:center;font-size:14px;color:#ffc98a;opacity:0;animation:rise 1s 3.5s forwards,fade 4s 9s forwards}
  @keyframes rise{from{opacity:0;transform:translateY(34px) scale(.96)}to{opacity:1;transform:none}}
  @keyframes shine{to{background-position:-250% 0}}
  @keyframes glow{50%{text-shadow:0 0 18px #ffb24d,0 0 50px #ff3d7a,0 0 100px #ff3d7a}}
  @keyframes bob{50%{transform:translateY(-6px)}}
  @keyframes fade{to{opacity:0}}
  @media (prefers-reduced-motion:reduce){*{animation-duration:.01s!important;animation-delay:0s!important}}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div class="poster">
  <div class="te">దీపావళి శుభాకాంక్షలు</div>
  <h1>Happy Deepavali</h1>
  <div class="name" id="name">Shushrutaa</div>
  <p class="line">May every diya you light bring you a brighter year.</p>
</div>
<div class="hint">Tap anywhere to light up the sky</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
// split name into letters for a gentle wave
(function(){const n=document.getElementById('name');n.innerHTML=[...n.textContent].map((c,i)=>'<span style="animation-delay:'+(i*0.12)+'s">'+c+'</span>').join('')})();

const canvas=document.getElementById('c');
const renderer=new THREE.WebGLRenderer({canvas,antialias:true,alpha:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
const scene=new THREE.Scene();
const camera=new THREE.PerspectiveCamera(50,1,0.1,200);
camera.position.set(0,1.2,11);

scene.add(new THREE.AmbientLight(0x6a3a7a,0.9));
const key=new THREE.DirectionalLight(0xffd29a,0.9);key.position.set(3,6,6);scene.add(key);

// soft glow texture
function glowTex(inner,outer){const s=128,c=document.createElement('canvas');c.width=c.height=s;const g=c.getContext('2d');
  const r=g.createRadialGradient(s/2,s/2,0,s/2,s/2,s/2);r.addColorStop(0,inner);r.addColorStop(.35,outer);r.addColorStop(1,'rgba(0,0,0,0)');
  g.fillStyle=r;g.fillRect(0,0,s,s);return new THREE.CanvasTexture(c)}
const flameTex=glowTex('rgba(255,250,210,1)','rgba(255,150,30,.75)');

// ---------- Diyas ----------
const profile=[[0,0],[.4,0],[.8,.14],[1.1,.45],[1.18,.62],[1.02,.56],[.7,.38],[0,.3]].map(p=>new THREE.Vector2(p[0],p[1]));
const bowlGeo=new THREE.LatheGeometry(profile,48);
const bowlMat=new THREE.MeshStandardMaterial({color:0xd9822b,metalness:.85,roughness:.35,side:THREE.DoubleSide,emissive:0x2a0c00});
const diyas=[];
function makeDiya(x,y,scale,phase){
  const g=new THREE.Group();
  g.add(new THREE.Mesh(bowlGeo,bowlMat));
  const wick=new THREE.Mesh(new THREE.CylinderGeometry(.04,.05,.35,8),new THREE.MeshStandardMaterial({color:0x222222}));
  wick.position.set(0,.5,0);g.add(wick);
  const flame=new THREE.Sprite(new THREE.SpriteMaterial({map:flameTex,blending:THREE.AdditiveBlending,depthWrite:false,transparent:true}));
  flame.scale.set(1.5,2.2,1);flame.position.set(0,1.15,0);g.add(flame);
  const halo=new THREE.Sprite(new THREE.SpriteMaterial({map:flameTex,color:0xff8a30,blending:THREE.AdditiveBlending,depthWrite:false,transparent:true,opacity:.35}));
  halo.scale.set(5,5,1);halo.position.set(0,1.1,-.2);g.add(halo);
  const light=new THREE.PointLight(0xff9a3a,1.2,9);light.position.set(0,1.3,.6);g.add(light);
  g.position.set(x,y,0);g.scale.setScalar(scale);g.userData={flame,halo,light,phase,baseY:y};
  scene.add(g);diyas.push(g);
}
const dx=[-6.2,-3.1,0,3.1,6.2],sc=[.8,1,1.35,1,.8],ys=[-3.6,-3.9,-4.1,-3.9,-3.6];
dx.forEach((x,i)=>makeDiya(x,ys[i],sc[i],i*1.3));

// ---------- Rangoli mandala (behind the diyas, tilted) ----------
const rangoli=new THREE.Group();
const cols=[0xe0245e,0xff8a1f,0xffc94d,0x9b3cff,0xff5fa0];
const petalGeo=new THREE.SphereGeometry(1,16,12);
[[1.2,8,.34],[2.2,12,.4],[3.3,16,.42],[4.5,24,.38],[5.6,32,.3]].forEach(([r,n,s],ring)=>{
  for(let i=0;i<n;i++){
    const a=i/n*Math.PI*2+ring*.2;
    const m=new THREE.Mesh(petalGeo,new THREE.MeshStandardMaterial({color:cols[(ring+i)%cols.length],emissive:cols[(ring+i)%cols.length],emissiveIntensity:.35,roughness:.5}));
    m.position.set(Math.cos(a)*r,Math.sin(a)*r,0);m.rotation.z=a;m.scale.set(s*1.7,s*.7,s*.5);rangoli.add(m);
  }
});
const core=new THREE.Mesh(new THREE.TorusKnotGeometry(.55,.16,120,16),new THREE.MeshStandardMaterial({color:0xffd36b,metalness:.9,roughness:.2,emissive:0x552200}));
rangoli.add(core);
rangoli.position.set(0,-4.3,-3);rangoli.rotation.x=-1.15;rangoli.scale.setScalar(1.15);
scene.add(rangoli);

// ---------- Stars + rising sparks ----------
function pointsField(n,spread,size,color){
  const p=new Float32Array(n*3);for(let i=0;i<n;i++){p.set([(Math.random()-.5)*spread.x,(Math.random()-.5)*spread.y,(Math.random()-.5)*spread.z-8],i*3)}
  const g=new THREE.BufferGeometry();g.setAttribute('position',new THREE.BufferAttribute(p,3));
  return new THREE.Points(g,new THREE.PointsMaterial({size,color,map:flameTex,transparent:true,depthWrite:false,blending:THREE.AdditiveBlending}));
}
const stars=pointsField(260,{x:60,y:34,z:30},.28,0xffeecc);scene.add(stars);
const sparks=pointsField(120,{x:22,y:16,z:8},.16,0xffa23a);sparks.position.y=-2;scene.add(sparks);

// ---------- Fireworks ----------
const bursts=[];
const palette=[[1,.78,.3],[1,.35,.5],[1,.55,.15],[.7,.4,1],[1,.95,.7]];
function burst(pos){
  const n=140,p=new Float32Array(n*3),v=new Float32Array(n*3),c=new Float32Array(n*3);
  const base=palette[Math.floor(Math.random()*palette.length)];
  for(let i=0;i<n;i++){
    p.set([pos.x,pos.y,pos.z],i*3);
    const th=Math.random()*Math.PI*2,ph=Math.acos(2*Math.random()-1),sp=2.2+Math.random()*2.2;
    v.set([Math.sin(ph)*Math.cos(th)*sp,Math.sin(ph)*Math.sin(th)*sp,Math.cos(ph)*sp],i*3);
    const t=Math.random()*.35;c.set([Math.min(1,base[0]+t),Math.min(1,base[1]+t),Math.min(1,base[2]+t)],i*3);
  }
  const g=new THREE.BufferGeometry();g.setAttribute('position',new THREE.BufferAttribute(p,3));g.setAttribute('color',new THREE.BufferAttribute(c,3));
  const m=new THREE.PointsMaterial({size:.45,map:flameTex,vertexColors:true,transparent:true,depthWrite:false,blending:THREE.AdditiveBlending});
  const pts=new THREE.Points(g,m);scene.add(pts);bursts.push({pts,v,life:1});
}
function randomBurst(){burst(new THREE.Vector3((Math.random()-.5)*16,Math.random()*5+1.5,-5-Math.random()*4))}
addEventListener('pointerdown',e=>{
  const v=new THREE.Vector3(e.clientX/innerWidth*2-1,-(e.clientY/innerHeight)*2+1,.5).unproject(camera);
  const d=v.sub(camera.position).normalize(),t=(-4-camera.position.z)/d.z;
  burst(camera.position.clone().add(d.multiplyScalar(t)));
});
setInterval(randomBurst,1400);
setTimeout(randomBurst,600);

// ---------- Interaction + loop ----------
const mouse={x:0,y:0};
addEventListener('pointermove',e=>{mouse.x=e.clientX/innerWidth-.5;mouse.y=e.clientY/innerHeight-.5});
function resize(){const w=innerWidth,h=innerHeight;renderer.setSize(w,h,false);camera.aspect=w/h;camera.position.z=w/h<.8?17:11;camera.updateProjectionMatrix()}
addEventListener('resize',resize);resize();

const clock=new THREE.Clock();
function tick(){
  const t=clock.getElapsedTime(),dt=Math.min(clock.getDelta(),.05)||.016;
  camera.position.x+=(mouse.x*2.4-camera.position.x)*.04;
  camera.position.y+=(1.2-mouse.y*1.6-camera.position.y)*.04;
  camera.lookAt(0,-.5,0);

  rangoli.rotation.z=t*.12;core.rotation.x=t*.8;core.rotation.y=t*.5;
  diyas.forEach(g=>{
    const u=g.userData,f=1+Math.sin(t*9+u.phase)*.06+Math.sin(t*23+u.phase*2)*.04;
    u.flame.scale.set(1.5*f,2.2*(f+Math.sin(t*5+u.phase)*.05),1);
    u.flame.material.rotation=Math.sin(t*3+u.phase)*.06;
    u.halo.material.opacity=.3+Math.sin(t*7+u.phase)*.06;
    u.light.intensity=1.1+Math.sin(t*11+u.phase)*.25;
    g.position.y=u.baseY+Math.sin(t*1.2+u.phase)*.12;
    g.rotation.y=Math.sin(t*.6+u.phase)*.35;g.rotation.x=.25;
  });
  stars.rotation.z=t*.004;stars.material.opacity=.7+Math.sin(t*2)*.2;
  const sp=sparks.geometry.attributes.position;
  for(let i=0;i<sp.count;i++){let y=sp.getY(i)+.012+((i%5)*.003);if(y>9)y=-9;sp.setY(i,y);sp.setX(i,sp.getX(i)+Math.sin(t+i)*.003)}
  sp.needsUpdate=true;

  for(let b=bursts.length-1;b>=0;b--){
    const B=bursts[b],pos=B.pts.geometry.attributes.position;
    for(let i=0;i<pos.count;i++){
      B.v[i*3+1]-=2.4*dt;
      pos.array[i*3]+=B.v[i*3]*dt;pos.array[i*3+1]+=B.v[i*3+1]*dt;pos.array[i*3+2]+=B.v[i*3+2]*dt;
      B.v[i*3]*=.985;B.v[i*3+2]*=.985;
    }
    pos.needsUpdate=true;B.life-=dt*.55;B.pts.material.opacity=Math.max(B.life,0);
    if(B.life<=0){scene.remove(B.pts);B.pts.geometry.dispose();B.pts.material.dispose();bursts.splice(b,1)}
  }
  renderer.render(scene,camera);requestAnimationFrame(tick);
}
tick();
</script>
</body>
</html>
